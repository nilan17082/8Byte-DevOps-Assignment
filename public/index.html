<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>8Byte DevOps API</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --accent: #38bdf8;
    --accent-2: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --good: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(56,189,248,0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(167,139,250,0.15), transparent 40%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.35);
    color: var(--good);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px var(--good);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    margin: 20px 0 8px;
    font-size: 28px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.subtitle {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }

  .endpoint {
    display: block;
    text-decoration: none;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .endpoint:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background: rgba(56,189,248,0.08);
  }

  .endpoint .method {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
  }

  .endpoint .path {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 15px;
    margin-top: 4px;
    color: var(--text);
  }

  .endpoint .desc {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }

  footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><span class="dot"></span> API Online</span>
    <h1>8Byte DevOps API</h1>
    <p class="subtitle">Node.js &amp; Express service running on ECS Fargate, behind an Application Load Balancer, backed by RDS PostgreSQL.</p>

    <div class="grid">
      <a class="endpoint" href="/health">
        <div class="method">GET</div>
        <div class="path">/health</div>
        <div class="desc">Service health check</div>
      </a>
      <a class="endpoint" href="/api/data">
        <div class="method">GET</div>
        <div class="path">/api/data</div>
        <div class="desc">Live database query</div>
      </a>
    </div>

    <footer>
      <span>Built for the 8Byte DevOps Assignment</span>
      <span id="clock"></span>
    </footer>
  </div>

  <script>
    const clock = document.getElementById('clock');
    function tick() {
      clock.textContent = new Date().toLocaleString();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
